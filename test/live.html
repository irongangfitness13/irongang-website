<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live hosted test</title>
<style>body{margin:0}</style>
<script>
  // Loads the LIVE GitHub-hosted version: /test/live.html?page=kgp
  // gtag and MailerLite are stubbed so nothing real is counted or submitted.
  window.__conv = 0; window.__sent = 0;
  window.gtag = function () { if (arguments[1] === 'conversion') window.__conv++; };
  var realFetch = window.fetch;
  window.fetch = function (u) {
    if (String(u).indexOf('mailerlite') !== -1) { window.__sent++; return Promise.resolve(new Response('')); }
    return realFetch.apply(this, arguments);
  };
</script>
</head><body>
<div id="sections"><section class="page-section"><div class="content-wrapper">
<div id="slot"></div>
</div></section></div>
<script>
  var page = new URLSearchParams(location.search).get('page') || 'home';
  document.getElementById('slot').setAttribute('data-igf-page', page);
  var s = document.createElement('script');
  s.src = 'https://irongangfitness13.github.io/irongang-website/loader.js';
  document.body.appendChild(s);
</script>
</body></html>
