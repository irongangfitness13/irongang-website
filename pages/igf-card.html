<style>
/* Iron Gang virtual card. Every rule is scoped to #igc so it can sit inside a Squarespace Code Block. */
@font-face{font-family:'IGC Display';font-weight:900;font-display:swap;src:url(https://irongangfitness13.github.io/irongang-website/assets/fonts/igc-display-900.woff2) format('woff2')}
@font-face{font-family:'IGC Display';font-weight:700;font-display:swap;src:url(https://irongangfitness13.github.io/irongang-website/assets/fonts/igc-display-700.woff2) format('woff2')}
@font-face{font-family:'IGC Text';font-weight:400;font-display:swap;src:url(https://irongangfitness13.github.io/irongang-website/assets/fonts/igc-text-400.woff2) format('woff2')}
@font-face{font-family:'IGC Text';font-weight:500;font-display:swap;src:url(https://irongangfitness13.github.io/irongang-website/assets/fonts/igc-text-500.woff2) format('woff2')}
#igc{--bg:#000;--ink:#fff;--soft:#c9c4bd;--tan:#d4b896;--red:#8b1a1a;--line:#2a2a2a;
  box-sizing:border-box;min-height:100vh;background:var(--bg);color:var(--ink);
  font:400 17px/1.45 'IGC Text','Arial Narrow',sans-serif;display:flex;justify-content:center;
  border-left:10px solid var(--red)}
#igc *{box-sizing:border-box}
#igc h1,#igc p{color:inherit}
#igc .wrap{width:100%;max-width:440px;padding:28px 22px 40px;display:flex;flex-direction:column;gap:22px}
#igc .logo{display:block;width:min(78%,300px);height:auto;margin:0 auto}
#igc .who{text-align:center;display:flex;flex-direction:column;gap:6px}
#igc h1{margin:0;color:var(--ink);font:900 44px/0.95 'IGC Display','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.01em}
#igc .role{margin:0;font:700 15px/1.3 'IGC Display',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--tan)}
#igc .pitch{margin:4px 0 0;color:var(--soft);font-size:17px}
#igc .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 16px;
  border-radius:0;text-decoration:none;font:700 19px/1 'IGC Display',sans-serif;letter-spacing:.14em;text-transform:uppercase;
  border:2px solid transparent;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
#igc .btn:focus-visible{outline:3px solid var(--tan);outline-offset:3px}
#igc .save{background:var(--red);color:#fff}
#igc .save:active{background:#6f1414}
#igc .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#igc .ghost{background:transparent;color:#fff;border-color:#4a4a4a;flex-direction:column;gap:6px;min-height:76px;font-size:16px}
#igc .ghost:active{border-color:var(--tan)}
#igc .ghost svg{width:24px;height:24px;stroke:var(--tan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#igc .apply{background:var(--tan);color:#000}
#igc .facts{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;display:grid;gap:6px;font-size:16px}
#igc .facts div{display:flex;justify-content:space-between;gap:12px}
#igc .facts span:first-child{color:var(--soft)}
#igc .facts a{color:#fff;text-decoration:none;white-space:nowrap}
#igc .tag{margin:0;color:var(--ink);text-align:center;font:900 22px/1.05 'IGC Display',sans-serif;text-transform:uppercase}
#igc .tag span{display:block;color:var(--tan)}
#igc .share{background:none;border:0;color:var(--soft);font:500 15px 'IGC Text',sans-serif;text-decoration:underline;cursor:pointer;min-height:44px;align-self:center}
#igc .toast{text-align:center;color:var(--tan);font-size:15px;min-height:20px;margin-top:-14px}
@media (prefers-reduced-motion:no-preference){#igc .btn{transition:background .15s,border-color .15s}}
</style>

<script>
{
  const toast = document.getElementById('igc-toast');
  const say = t => { toast.textContent = t; };
  document.getElementById('igc-share').addEventListener('click', async () => {
    const data = {title: 'Josh Gangaware | Iron Gang Fitness', url: location.href};
    try {
      if (navigator.share) { await navigator.share(data); return; }
      await navigator.clipboard.writeText(location.href); say('Link copied.');
    } catch (err) { if (err && err.name !== 'AbortError') say('Copy this page link from the address bar.'); }
  });
}
</script>
