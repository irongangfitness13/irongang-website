  --ink-000:#000000; --ink-050:#080807; --ink-100:#0F0E0D; --ink-200:#161513;
  --ink-300:#211F1C; --ink-400:#2E2B27; --ink-500:#4A453E; --ink-600:#6B655B;
  --bone-100:#F2EEE6; --bone-200:#E4DED4; --bone-300:#D3CBBE; --bone-400:#B8AF9F; --bone-500:#94897A;
  --blood-300:#D9452A; --blood-400:#C23318; --blood-500:#A32A16; --blood-600:#7F2011; --blood-700:#4A1309;
  --fairway-400:#5A6B4C; --fairway-500:#42513A;

  --font-display:"Anton","Oswald","Arial Narrow",sans-serif;
  --font-condensed:"Oswald","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,sans-serif;
  --font-body-condensed:"Barlow Semi Condensed",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;

  /* Display sizes trimmed and line height opened from the design system's
     0.88. That value is poster spec and collides on multi line web headlines.
     Level 2 to 3 rule: legibility beats striking. */
  --size-display-1:clamp(40px,7.4vw,94px);
  --size-display-3:clamp(26px,3.6vw,46px);
  --ls-label:0.16em; --ls-button:0.1em;

  --content-max:1200px;
  --gutter:24px; --gutter-lg:48px;
  --section-y:96px;

  --shadow-hard:6px 6px 0 var(--ink-000);
  --shadow-hard-accent:6px 6px 0 var(--blood-600);
  --image-treatment:grayscale(1) contrast(1.18) brightness(0.82);
  --protect-top:linear-gradient(to bottom,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0) 62%);
  --protect-bottom:linear-gradient(to top,rgba(0,0,0,0.96) 0%,rgba(0,0,0,0.72) 38%,rgba(0,0,0,0) 78%);
  --ease-out:cubic-bezier(0.2,0,0.1,1);
}

/* reset, scoped so it cannot leak into a host page */
.kgp *,.kgp *::before,.kgp *::after{box-sizing:border-box;}
.kgp{
  margin:0; background:var(--ink-050); color:var(--bone-200);
  position:relative; z-index:1; width:100%;
  font-family:var(--font-body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.kgp p,.kgp h1,.kgp h2,.kgp h3,.kgp h4,.kgp ul,.kgp ol,.kgp figure{margin:0;}
.kgp ul{padding:0;list-style:none;}
.kgp img{display:block;max-width:100%;}
.kgp a{color:inherit;}
.kgp button,.kgp input,.kgp select,.kgp textarea{font:inherit;color:inherit;}

.kgp .wrap{max-width:var(--content-max);margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter);}
@media(min-width:900px){.kgp .wrap{padding-left:var(--gutter-lg);padding-right:var(--gutter-lg);}}

.kgp section{border-top:1px solid var(--ink-300);}
.kgp .band{padding:var(--section-y) 0;}
.kgp .bleed{background:var(--ink-000);}

/* ---------- type roles ---------- */
.kgp .eyebrow{
  font-family:var(--font-condensed);font-weight:600;font-size:12px;
  letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--blood-400);
}
.kgp .eyebrow.mute{color:var(--bone-400);}
.kgp h1{
  font-family:var(--font-display);font-size:var(--size-display-1);line-height:0.97;
  letter-spacing:0.015em;text-transform:uppercase;color:var(--bone-100);
}
.kgp h2{
  font-family:var(--font-display);font-size:var(--size-display-3);line-height:1.0;
  letter-spacing:0.015em;text-transform:uppercase;color:var(--bone-100);
  margin-top:16px;max-width:26ch;
}
.kgp h3{
  font-family:var(--font-condensed);font-weight:600;font-size:20px;line-height:1.15;
  letter-spacing:0.02em;text-transform:uppercase;color:var(--bone-100);
}
.kgp .lede{font-size:19px;line-height:1.55;color:var(--bone-300);max-width:60ch;}
.kgp .prose{color:var(--bone-300);max-width:66ch;}
.kgp .prose + .prose{margin-top:18px;}
.kgp .muted{color:var(--bone-500);}
.kgp .red{color:var(--blood-400);}
.kgp .verdict{
  font-family:var(--font-condensed);font-weight:600;font-size:21px;line-height:1.35;
  letter-spacing:0.03em;text-transform:uppercase;color:var(--bone-100);
}
.kgp h3{line-height:1.22;}

/* ---------- buttons ---------- */
.kgp .btn{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-condensed);font-weight:600;font-size:14px;
  letter-spacing:var(--ls-button);text-transform:uppercase;
  padding:16px 28px;border:2px solid var(--blood-500);border-radius:0;
  background:var(--blood-500);color:var(--bone-100);text-decoration:none;cursor:pointer;
  box-shadow:var(--shadow-hard);
  transition:background-color 90ms var(--ease-out),border-color 90ms var(--ease-out),
             box-shadow 90ms var(--ease-out),transform 90ms var(--ease-out);
}
.kgp .btn:hover{background:var(--blood-400);border-color:var(--blood-400);}
.kgp .btn:active{background:var(--blood-600);border-color:var(--blood-600);transform:translate(2px,2px);box-shadow:4px 4px 0 var(--ink-000);}
.kgp .btn:focus-visible{outline:2px solid var(--blood-400);outline-offset:2px;}
.kgp .btn.ghost{background:transparent;border-color:var(--bone-500);color:var(--bone-200);box-shadow:none;}
.kgp .btn.ghost:hover{background:var(--bone-200);border-color:var(--bone-200);color:var(--ink-050);}
.kgp .btn.sm{padding:11px 18px;font-size:13px;box-shadow:3px 3px 0 var(--ink-000);}
.kgp .btn.block{width:100%;}

/* ---------- header ---------- */
.kgp .site-head{
  position:sticky;top:0;z-index:40;background:var(--ink-050);
  border-bottom:1px solid var(--ink-300);border-top:0;
}
.kgp .head-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;height:74px;}
.kgp .lockup{display:flex;align-items:center;gap:12px;text-decoration:none;}
.kgp .lockup .mark{
  width:42px;height:42px;flex:none;background-image:var(--img-badge);
  background-size:cover;background-position:center;
}
.kgp .lockup .names{display:flex;flex-direction:column;line-height:1;}
.kgp .lockup .parent{
  font-family:var(--font-condensed);font-weight:600;font-size:10px;
  letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--bone-500);
}
.kgp .lockup .child{
  font-family:var(--font-display);font-size:18px;letter-spacing:0.01em;
  text-transform:uppercase;color:var(--bone-100);margin-top:5px;
}
@media(max-width:620px){
  .kgp .lockup .child{font-size:15px;}
  .kgp .lockup .mark{width:34px;height:34px;}
  .kgp .head-inner{gap:12px;height:66px;}
  .kgp .head-inner .btn{padding:9px 12px;font-size:11px;box-shadow:none;}
  .kgp .head-inner .btn.hide-sm{display:none;}
}

/* ---------- ready now strip ---------- */
.kgp .ready{
  border:2px solid var(--ink-400);background:var(--ink-200);
  padding:26px 24px;margin-top:40px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.kgp .ready h3{margin-bottom:8px;}
.kgp .ready p{font-size:15px;color:var(--bone-500);max-width:46ch;}
.kgp .ready .btn{flex:none;}
.kgp .head-actions{display:flex;align-items:center;gap:10px;}

/* ---------- hero ---------- */
.kgp .hero{position:relative;min-height:640px;display:flex;align-items:flex-end;border-top:0;}
.kgp .hero-img{
  position:absolute;inset:0;background-image:var(--img-hero);
  background-size:cover;background-repeat:no-repeat;background-position:50% 50%;
  filter:var(--image-treatment);
}
.kgp .hero-top{position:absolute;inset:0;background:var(--protect-top);}
.kgp .hero-bot{position:absolute;inset:0;background:var(--protect-bottom);}
.kgp .hero-body{position:relative;z-index:2;width:100%;padding-top:120px;padding-bottom:72px;}
.kgp .hero h1{margin:20px 0 22px;max-width:15ch;}

/* ---------- hero, wide screens ----------
   The key art is a purpose built 16:9 with the figure on the right and an
   open field on the left. The hero holds that ratio so the skull and the
   ball both survive, and the headline sits in the open left half behind a
